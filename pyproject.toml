[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "constat"
description = "Turn software changes into evidence-backed, human-approved knowledge."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Emmanuel Padjinou", email = "emmanuel@padjinou.com" }]
keywords = ["git", "change-management", "governance", "provenance", "evidence"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
]

# One dependency, with a stated reason (D-015, D-026): schema validation for
# the models that are persisted, rendered and frozen into baselines. The
# evidence path still depends on no AI provider (D-003).
dependencies = ["pydantic>=2.7"]

dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
constat = "constat.cli:main"

[project.urls]
Homepage = "https://tryconstat.com"
Source = "https://github.com/padjis/constat"

# Discovered rather than listed. An explicit list was the CON-46 defect: it
# said `packages = ["constat"]`, so every subpackage was silently dropped from
# the wheel while the editable development install kept importing from the
# working tree. A list has to be remembered on every new subpackage, and
# forgetting it produces a broken artefact rather than an error.
[tool.setuptools.packages.find]
include = ["constat*"]
namespaces = false

# Single source of truth for the version: constat/__init__.py.
# Keeping it in one place means the CLI and the package metadata cannot drift.
[tool.setuptools.dynamic]
version = { attr = "constat.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
